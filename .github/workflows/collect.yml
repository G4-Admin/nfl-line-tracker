name: Collect NFL lines

on:
  schedule:
    # 06:12 UTC = 12:12am Denver (MDT), 11:12pm (MST after the November change).
    # Deliberately off the hour: top-of-hour is when everyone's crons fire and
    # GitHub drops or delays scheduled runs under that load.
    #
    # Why so early. GitHub does not start this when the cron says. Measured
    # 09-21..10-12 the commit landed 3h45m to 9h03m after the cron fired. The
    # tracker run reads at 16:00 UTC, so an 11:12 cron was landing after it on
    # most days. 06:12 leaves ~9h48m of slack.
    #
    # Why not earlier. It must run AFTER the previous night's game finishes or
    # there is no final score to collect. A Monday nighter plus overtime ends by
    # about 04:00 UTC; 06:12 clears that with ~2h to spare.
    - cron: "12 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet openpyxl

      - name: Pull odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEASON_ANCHOR: ${{ vars.SEASON_ANCHOR || '2026-09-08' }}
        run: python scripts/collect.py

      - name: Collect game context (injuries, weather)
        run: python scripts/context.py
        continue-on-error: true

      - name: Fetch final scores
        # results.py reads the Odds API scores endpoint, so it needs the same
        # secret collect.py uses. `env:` is per-step in Actions: without this
        # block the key is simply absent here, the script exits "not set", and
        # continue-on-error turns that into a GREEN run with no scores. The old
        # ESPN version needed no key, which is why this never bit before.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/results.py
        continue-on-error: true

      - name: Rebuild master spreadsheet
        run: python scripts/build_sheet.py

      - name: Commit
        run: |
          git config user.name  "nfl-line-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "lines: $(date -u +%Y-%m-%d)"
            git push
          fi
