name: Collect NFL lines

on:
  schedule:
    # 05:12 America/Denver during MDT (11:12 UTC), 04:12 after the November
    # clock change. GitHub cron is UTC-only. Deliberately NOT on the hour:
    # top-of-hour is when everyone's crons fire, and GitHub delays or drops
    # scheduled runs under that load. An odd minute gets picked up on time.
    #
    # Why 11:12 and not 15:12: the run itself is only the start time. Measured
    # 09-02..09-09, the output landed 1h50m-3h44m after the cron, every day
    # between 17:02 and 18:56 UTC -- i.e. after the 16:00 UTC (10am Denver)
    # tracker run had already read the file and stopped at its freshness gate.
    # Four hours earlier puts the output on the ground around 13:00-15:00 UTC,
    # ahead of both the daily tracker run and Saturday's picks deadline.
    - cron: "12 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet openpyxl

      - name: Pull odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEASON_ANCHOR: ${{ vars.SEASON_ANCHOR || '2026-09-08' }}
        run: python scripts/collect.py

      - name: Collect game context (injuries, weather)
        run: python scripts/context.py
        continue-on-error: true

      - name: Fetch final scores
        run: python scripts/results.py
        continue-on-error: true

      - name: Rebuild master spreadsheet
        run: python scripts/build_sheet.py

      - name: Commit
        run: |
          git config user.name  "nfl-line-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "lines: $(date -u +%Y-%m-%d)"
            git push
          fi
